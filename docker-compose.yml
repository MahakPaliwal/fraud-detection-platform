services:
  redis:
    image: redis
    container_name: redis-fraud
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    ports:
      - "6379:6379"

  api:
    build: .
    container_name: fraud-api
    ports:
      - "8000:8000"
    depends_on:
      - redis
    environment:
      - REDIS_HOST=redis
    env_file:
      - .env

volumes:
  redis-data:
